<!DOCTYPE html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F3C7E">
<title>Studyhub</title>
<link rel="apple-touch-icon" href="studyhub-icono-180.png">
<link rel="icon" type="image/svg+xml" href="studyhub-icono.svg">
<link rel="icon" type="image/png" sizes="512x512" href="studyhub-icono-512.png">
<meta name="apple-mobile-web-app-title" content="Studyhub">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --navy:#2F3C7E; --navy-d:#222A5C; --navy-l:#CADCFC; --navy-m:#8b93bd;
  --coral:#E8535A; --coral-soft:#FDECEC;
  --gold:#F9C74F; --gold-soft:#FFF7E0; --gold-ink:#6b4a00;
  --teal:#027480; --teal-soft:#E3F2F2;
  --green:#2C5F2D; --green-soft:#E6F0E6;
  --ink:#141a33; --ink-2:#434a66; --ink-3:#6a7190;
  --line:#e2e4ee; --line-2:#eef0f6;
  --ground:#F5F6FB; --paper:#ffffff;
  --accent:var(--coral); --accent-soft:var(--coral-soft);
  --display:"Bricolage Grotesque", "Manrope", system-ui, sans-serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
.mode-solo{ --accent:var(--teal); --accent-soft:var(--teal-soft); }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-0.01em}
.hidden{display:none!important}


/* auth */
.auth{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.auth.dark{background:var(--navy);color:#fff;position:relative;overflow:hidden}
.auth.dark::before,.auth.dark::after{content:"";position:absolute;border-radius:50%;background:var(--navy-d)}
.auth.dark::before{width:420px;height:420px;top:-160px;right:-120px}
.auth.dark::after{width:300px;height:300px;bottom:-140px;left:-90px}
.welcome{position:relative;z-index:1;max-width:520px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.dots{display:flex}
.dots span{width:34px;height:34px;border-radius:50%;border:3px solid var(--navy);margin-left:-10px}
.dots span:first-child{margin-left:0;background:var(--coral)}
.dots span:nth-child(2){background:var(--gold)}
.dots span:nth-child(3){background:#028090}
.welcome h1{font-size:clamp(34px,6vw,48px);font-weight:800}
.welcome p{color:var(--navy-l);font-size:16px;margin:0;max-width:40ch}
.stack{display:flex;flex-direction:column;gap:12px;width:min(320px,100%);margin-top:14px}
.fine{font-size:12px;color:var(--navy-m);margin-top:10px}

.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:32px;width:min(460px,100%);box-shadow:0 1px 2px rgba(20,26,51,.04),0 8px 24px rgba(20,26,51,.05)}
.card h2{font-size:26px}
.brand{font-family:var(--display);font-weight:800;color:var(--navy);font-size:15px;margin-bottom:10px;display:block}
.sub{color:var(--ink-3);margin:6px 0 20px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.input,.select,textarea.input{border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;background:var(--paper);width:100%}
.input:focus,.select:focus{border-color:var(--navy);outline:none;box-shadow:0 0 0 3px rgba(47,60,126,.12)}
.hint{font-size:11.5px;color:var(--ink-3)}
.err{font-size:12px;color:#b3261e;font-weight:600;min-height:0}
.check{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--ink-3);margin:4px 0 16px}
.check input{margin-top:3px;accent-color:var(--navy);width:16px;height:16px}
.btn{border:0;border-radius:10px;padding:13px 20px;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;text-decoration:none}
.btn-primary{background:var(--coral);color:#fff}
.btn-primary:hover{filter:brightness(.95)}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{filter:brightness(.94)}
.btn-ghost-dark{background:transparent;color:#fff;border:1.5px solid #5a65a3}
.btn-ghost-dark:hover{background:rgba(255,255,255,.06)}
.btn-line{background:var(--paper);border:1.5px solid var(--line);color:var(--ink)}
.btn-line:hover{border-color:var(--ink-3)}
.btn-gold{background:var(--gold);color:var(--gold-ink)}
.btn-sm{padding:8px 14px;min-height:36px;font-size:13px;border-radius:8px}
.btn-block{width:100%}
.link{background:none;border:0;padding:0;color:var(--navy);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.center{text-align:center}
.mailicon{width:64px;height:64px;border-radius:50%;background:var(--ground);display:grid;place-items:center;margin:0 auto 14px}
.inbox{border:1px solid var(--line);border-radius:12px;margin:22px 0 8px;overflow:hidden;text-align:left}
.inbox-head{background:var(--ground);padding:10px 14px;font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between;gap:8px}
.inbox-body{padding:16px;display:flex;flex-direction:column;gap:10px}
.inbox-body strong{font-size:14px}

/* mode picker */
.modewrap{width:min(860px,100%);text-align:center}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--coral)}
.modewrap h1{font-size:clamp(28px,4.5vw,38px);margin:8px 0}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:28px 0}
.modecard{text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:28px 24px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s, transform .15s}
.modecard:hover{transform:translateY(-2px)}
.modecard .ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--ground);color:var(--ink-3)}
.modecard h3{font-size:20px}
.modecard p{margin:0;color:var(--ink-3)}
.modecard ul{margin:4px 0 0;padding-left:18px;color:var(--ink-2);font-size:13px}
.modecard.sel-a{border-color:var(--coral)} .modecard.sel-a .ic{background:var(--coral);color:#fff}
.modecard.sel-s{border-color:var(--teal)} .modecard.sel-s .ic{background:var(--teal);color:#fff}

/* app shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.side{background:var(--navy);color:var(--navy-l);display:flex;flex-direction:column;padding:22px 0;position:sticky;top:0;height:100vh;height:100dvh}
.side .logo{font-family:var(--display);font-weight:800;font-size:21px;color:#fff;padding:0 22px 16px}
.seg{margin:0 16px 18px;background:var(--navy-d);border-radius:10px;padding:4px;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.seg button{border:0;background:transparent;color:var(--navy-l);border-radius:7px;padding:7px 4px;font-size:12px;font-weight:700}
.seg button.on-a{background:var(--coral);color:#fff}
.seg button.on-s{background:var(--teal);color:#fff}
.nav{display:flex;flex-direction:column;flex:1}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--navy-l);padding:11px 22px;font-size:14px;text-align:left;border-left:3px solid transparent;min-height:44px}
.nav button:hover{background:rgba(255,255,255,.05);color:#fff}
.nav button.on{background:var(--navy-d);color:#fff;font-weight:700;border-left-color:var(--accent)}
.nav button.on svg{stroke:var(--accent)}
.nav button .badge{margin-left:auto;background:var(--coral);color:#fff;border-radius:999px;font-size:10.5px;font-weight:800;padding:1px 7px}
.nav .bottom{margin-top:auto}
.main{padding:36px clamp(16px,4vw,52px) 60px;min-width:0}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.kicker{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.pagehead h1{font-size:clamp(24px,3.2vw,32px);margin-top:4px}
.pagehead p{margin:4px 0 0;color:var(--ink-3);max-width:60ch}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px}
.panel h3{font-size:16px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}

/* stepper */
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}
.stepper span{font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--line-2);color:var(--ink-3)}
.stepper span.done{background:var(--green-soft);color:var(--green)}
.stepper span.now{background:var(--coral);color:#fff}

/* subjects */
.search{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:4px 6px 4px 14px;max-width:640px;margin-bottom:22px}
.search input{border:0;flex:1;padding:9px 0;background:transparent;outline:none;min-width:0}
.label-caps{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0 0 12px}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;max-width:960px}
.subj{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:120px}
.subj:hover{border-color:var(--ink-3)}
.subj .sym{width:36px;height:36px;border-radius:9px;background:var(--line-2);display:grid;place-items:center;font-weight:800;color:var(--ink-3);font-size:14px}
.subj strong{font-size:14px}
.subj small{color:var(--ink-3);font-size:11.5px}
.subj.on{border:2px solid var(--navy);background:#F4F5FB}
.subj.on .sym{background:var(--navy);color:#fff}
.subj.add{border-style:dashed;align-items:center;justify-content:center;color:var(--ink-3)}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:26px}

/* results */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:600;color:var(--ink-2);min-height:34px}
.chip.on{border-color:var(--navy);background:var(--navy);color:#fff}
.unibar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:10px}
.unibar .chips{margin:0}
.unibar .search{flex:1 1 240px;max-width:340px;margin:0;padding:0 12px;border-radius:999px}
.unibar .search input{padding:7px 0;font-size:13px}
.unilist{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.unilist:empty{display:none}
.unilist p{margin:0}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.cand{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px}
.who{display:flex;gap:12px;align-items:center}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex-shrink:0;font-family:var(--display)}
.who strong{display:block;font-size:15px}
.who small{color:var(--ink-3);font-size:12px}
.pct{font-family:var(--display);font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:4px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.xchg{font-size:12px;background:var(--gold-soft);color:var(--gold-ink);border-radius:8px;padding:7px 10px}
.tagrow{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--line-2);color:var(--ink-2)}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--ink-3)}

/* profile */
.back{display:inline-flex;align-items:center;gap:8px;border:0;background:none;color:var(--ink-3);font-weight:700;padding:0;margin-bottom:18px;min-height:32px}
.back:hover{color:var(--ink)}
.prof{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
.profside{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:14px 0 4px}
.ring div{width:118px;height:118px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:32px}
.brk{display:flex;flex-direction:column;gap:18px}
.brk .row .top{display:flex;justify-content:space-between;font-weight:700;font-size:13px;margin-bottom:6px}
.quote{background:var(--ground);border-radius:12px;padding:18px;font-style:italic;color:var(--ink-2)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fact{border:1px solid var(--line);border-radius:10px;padding:12px}
.fact small{display:block;color:var(--ink-3);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}

/* chat */
.chat{display:grid;grid-template-columns:260px minmax(0,1fr);background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-height:560px}
.convs{border-right:1px solid var(--line);padding:16px 0}
.convs h3{font-size:15px;padding:0 18px 10px}
.conv{display:flex;gap:10px;align-items:center;padding:12px 18px;border-left:3px solid transparent}
.conv.on{background:#F4F5FB;border-left-color:var(--navy)}
.conv .avatar{width:36px;height:36px;font-size:13px}
.conv div{min-width:0}
.conv strong{font-size:13px;display:block}
.conv small{color:var(--ink-3);font-size:11.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread{display:flex;flex-direction:column;min-width:0}
.thead{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.thead strong{display:block}
.pill{margin-left:auto;border:1.5px solid var(--navy);color:var(--navy);border-radius:999px;padding:3px 11px;font-size:11.5px;font-weight:700;white-space:nowrap}
.msgs{flex:1;padding:20px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;max-height:520px}
.msg{max-width:min(70%,460px);padding:10px 14px;border-radius:14px;font-size:13.5px}
.msg.them{align-self:flex-start;background:var(--line-2);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.msg.sys{align-self:center;background:var(--green-soft);color:var(--green);font-size:12px;font-weight:700;border-radius:999px;padding:6px 14px}
.prop{align-self:center;width:min(400px,100%);border:1.5px solid var(--gold);background:var(--gold-soft);border-radius:14px;padding:16px}
.prop .t{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--gold-ink);margin-bottom:8px}
.prop p{margin:0 0 4px;font-size:13px}
.prop .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.prop .acts .btn{flex:1}
.prop .state{margin-top:10px;font-size:12px;font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.compose{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line)}
.compose input{flex:1;border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;min-width:0}
.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--coral);display:grid;place-items:center;flex-shrink:0}
.sched{border-top:1px solid var(--line);padding:16px 20px;background:#FAFBFE}
.sched h3{font-size:15px;margin-bottom:10px}
.sched .row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}

/* confirmed */
.okhead{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.okdot{width:48px;height:48px;border-radius:50%;background:var(--green);display:grid;place-items:center;flex-shrink:0}
.sess{border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.sess .line{display:flex;gap:10px;align-items:center;color:var(--ink-2);font-size:13.5px}
.note{background:#F4F5FB;border-radius:10px;padding:12px 14px;color:var(--navy);font-size:12.5px;font-weight:600}
.groupnudge{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px;font-size:14px}
.ctabtns{display:flex;gap:10px;flex-wrap:wrap}

/* calendar */
.calwrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:14px}
.cal{display:grid;grid-template-columns:92px repeat(7,minmax(104px,1fr));min-width:820px}
.cal .h{padding:12px 8px;font-size:12px;font-weight:800;text-align:center;border-bottom:1px solid var(--line);color:var(--ink-2)}
.cal .t{padding:10px;font-size:11px;color:var(--ink-3);border-bottom:1px solid var(--line-2);font-variant-numeric:tabular-nums}
.cal .c{border-left:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:6px;min-height:78px}
.cal .c.free{background:transparent;border-top:0;border-right:0;width:100%;text-align:left;color:transparent;font-size:11px;font-weight:700}
.cal .c.free:hover{background:var(--accent-soft);color:var(--accent)}
.blk{border-radius:8px;padding:7px 9px;font-size:11.5px;font-weight:700;line-height:1.3;position:relative}
.blk small{display:block;font-weight:500;opacity:.85}
.blk.class{background:var(--line-2);color:var(--ink-2)}
.blk.study{background:var(--teal-soft);color:#04545c}
.blk.session{background:var(--coral);color:#fff}
.blk .x{position:absolute;top:3px;right:4px;border:0;background:none;color:inherit;opacity:.6;font-size:14px;line-height:1;padding:2px 4px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin-top:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.addform{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:18px}
.kindpick{grid-column:1/-1;border:0;padding:0;margin:0 0 4px}
.kindpick legend{font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:8px;padding:0}
.kindpick .opts{display:flex;gap:8px;flex-wrap:wrap;margin:0}
.kindpick label{position:relative}
.kindpick input{position:absolute;opacity:0;pointer-events:none}
.kindpick span{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);font-size:13px;font-weight:700;color:var(--ink-2);cursor:pointer;background:var(--paper)}
.kindpick span i{width:12px;height:12px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(20,26,51,.22)}
.kindpick input:checked+span{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy);color:var(--ink)}
.kindpick input:focus-visible+span{outline:2.5px solid var(--gold);outline-offset:2px}

/* home */
.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--paper)}
.task input{width:18px;height:18px;accent-color:var(--teal);flex-shrink:0}
.task span{flex:1}
.task.done span{text-decoration:line-through;color:var(--ink-3)}
.task small{color:var(--ink-3);font-variant-numeric:tabular-nums}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;min-width:0}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:120px}
.qcard:hover{border-color:var(--accent)}
.qcard strong{font-size:15px}
.qcard small{color:var(--ink-3)}
.hero-cta{background:var(--navy);color:#fff;border-radius:16px;padding:24px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:20px}
.hero-cta h2{font-size:22px}
.hero-cta p{margin:4px 0 0;color:var(--navy-l);max-width:46ch}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--paper)}
.item .grow{flex:1;min-width:0}
.item strong{display:block;font-size:13.5px}
.item small{color:var(--ink-3)}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums;line-height:1.1}

/* notebooks */
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.book{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:150px}
.book:hover{border-color:var(--accent)}
.book .bi{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center}
.book strong{font-size:15px}
.book small{color:var(--ink-3)}
.book.add{border-style:dashed;align-items:center;justify-content:center;color:var(--ink-3)}
.notes{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.notecard{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--paper)}
.notecard small{color:var(--ink-3);display:block;margin-bottom:4px}

/* tools */
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tool{display:flex;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px}
.tool .ti{width:44px;height:44px;border-radius:10px;background:#F4F5FB;display:grid;place-items:center;flex-shrink:0}
.tool .grow{flex:1;min-width:0}
.tool strong{display:block}
.tool small{color:var(--ink-3)}
.on-badge{border:1.5px solid var(--green);color:var(--green);background:var(--green-soft)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .2s;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width: 900px){
  .grid2,.prof{grid-template-columns:1fr}
  .quick{grid-template-columns:1fr 1fr}
  .chat{grid-template-columns:1fr}
  .convs{display:none}
  .addform{grid-template-columns:1fr 1fr}
}
@media (max-width: 780px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;padding:12px 0 0}
  .side .logo{padding:0 16px 10px}
  .seg{margin:0 16px 10px}
  .nav{flex-direction:row;overflow-x:auto;flex:none}
  .nav button{padding:10px 14px;border-left:0;border-bottom:3px solid transparent;white-space:nowrap}
  .nav button.on{border-bottom-color:var(--accent)}
  .nav .bottom{margin-top:0}
  .modes{grid-template-columns:1fr}
  .facts{grid-template-columns:1fr}

}
@media (max-width: 480px){
  .quick{grid-template-columns:1fr}
  .card{padding:24px 20px}
}
/* calificaciones */
.stars{display:inline-flex;gap:2px;vertical-align:-2px}
.stars svg{flex:none}
.rate{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.rate small{font-weight:600;color:var(--ink-3)}
.starpick{display:flex;gap:4px}
.starpick button{border:0;background:transparent;padding:4px;border-radius:8px;min-width:40px;min-height:40px;display:grid;place-items:center}
.starpick button:hover{background:var(--gold-soft)}
.rdim{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line-2)}
.rdim:last-of-type{border-bottom:0}
.rdim span{font-weight:700;font-size:13.5px}
.rdim small{display:block;font-weight:500;color:var(--ink-3);font-size:12px}
.yn{display:flex;gap:8px;flex-wrap:wrap}
.review{border-top:1px solid var(--line-2);padding:12px 0 0;margin-top:12px;font-size:13px;color:var(--ink-2)}
.review small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:4px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(20,26,51,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--paper);border-radius:18px;width:min(520px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:24px}
.modal h2{font-size:22px}
/* perfil */
.lvl{font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap}
.lvl-0{background:var(--coral-soft);color:#a3262c}
.lvl-1{background:var(--gold-soft);color:var(--gold-ink)}
.lvl-2{background:var(--teal-soft);color:#04545c}
.lvl-3{background:var(--green-soft);color:var(--green)}
.subrow{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.subrow .top{display:flex;gap:8px}
.subrow .top .input{flex:1;min-width:0}
.seglvl{display:flex;flex-wrap:wrap;gap:6px}
.seglvl label{position:relative}
.seglvl input{position:absolute;opacity:0;pointer-events:none}
.seglvl span{display:inline-flex;align-items:center;min-height:34px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);font-size:12.5px;font-weight:700;color:var(--ink-2);cursor:pointer}
.seglvl input:checked+span{border-color:var(--navy);background:var(--navy);color:#fff}
.seglvl input:focus-visible+span{outline:2.5px solid var(--gold);outline-offset:2px}
.iconbtn{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);display:grid;place-items:center;flex:none;color:var(--ink-3)}
.iconbtn:hover{border-color:var(--coral);color:var(--coral)}
.knows{display:flex;flex-direction:column;gap:10px}
.know{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.know strong{display:block;font-size:14px}
.know small{color:var(--ink-3)}
.dimrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;margin-bottom:10px;font-size:13px;font-weight:700}
.dimrow .bar{grid-column:1/-1}

/* celular: barra inferior y hoja "Más" */
.tabbar,.sheet,.agenda{display:none}
@media (max-width: 780px){
  .app{padding-bottom:calc(68px + env(safe-area-inset-bottom,0px))}
  .side{flex-direction:row;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));position:sticky;top:0;z-index:20;height:auto}
  .side .logo{padding:0;font-size:19px}
  .side .seg{margin:0;width:200px;flex:none}
  .side .nav{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--paper);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;min-height:52px;font-size:11px;font-weight:700;color:var(--ink-3);border-radius:10px;position:relative}
  .tabbar button.on{color:var(--navy)}
  .tabbar button.on svg{stroke:var(--accent)}
  .tabbar .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--coral);color:#fff;border-radius:999px;font-size:10px;font-weight:800;padding:0 6px}
  .sheet.open{display:block;position:fixed;inset:0;z-index:45;background:rgba(20,26,51,.4)}
  .sheet .box{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:18px 18px 0 0;padding:10px 16px calc(84px + env(safe-area-inset-bottom,0px))}
  .sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 12px}
  .sheet button.it{display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;padding:14px 8px;font-size:15px;font-weight:700;color:var(--ink);border-bottom:1px solid var(--line-2);text-align:left}
  .sheet button.it:last-child{border-bottom:0}
  .main{padding:22px 16px 32px}
  .stepper{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
  .stepper span{white-space:nowrap}
  .calwrap{display:none}
  .agenda{display:flex;flex-direction:column;gap:12px}
  .aday{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px}
  .aday h4{margin:0 0 10px;font-family:var(--display);font-size:15px}
  .aday .blk{margin-bottom:8px;padding:10px 32px 10px 12px;font-size:13px}
  .aday .slot{display:block;font-weight:600;opacity:.8;font-size:11.5px;margin-bottom:2px}
  .aday .none{font-size:12.5px;color:var(--ink-3)}
  .aday .addday{border:1.5px dashed var(--line);background:transparent;border-radius:8px;width:100%;padding:9px;font-size:12.5px;font-weight:700;color:var(--ink-3);margin-top:2px}
  .chat{min-height:0}
  .msgs{max-height:52vh}
  .msg{max-width:85%}
  .thead{padding:12px 14px}
  .compose{padding:12px 14px}
  .sched{padding:14px}
  .hero-cta .btn{width:100%}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (max-width: 480px){
  .addform{grid-template-columns:1fr}
  .side .seg{width:172px}
  .modecard{padding:22px 18px}
}
/* confianza y seguridad */
.tag.ver{background:var(--green-soft);color:var(--green)}
.safety{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--ink-2);background:var(--green-soft);border-radius:8px;padding:8px 10px;margin-top:10px}
.choice{display:flex;flex-direction:column;gap:8px}
.choice label{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;cursor:pointer}
.choice input{margin-top:3px;accent-color:var(--navy);width:16px;height:16px;flex:none}
.choice label:has(input:checked){border-color:var(--navy);background:#F4F5FB}
/* grupos */
.segsw{display:inline-grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--line-2);border-radius:12px;padding:4px;margin-bottom:18px;max-width:100%}
.segsw button{border:0;background:transparent;border-radius:9px;padding:9px 16px;font-weight:700;font-size:13px;color:var(--ink-2);min-height:40px}
.segsw button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(20,26,51,.12)}
.members{display:flex;align-items:center}
.members .avatar{width:34px;height:34px;font-size:13px;border:2.5px solid var(--paper);margin-left:-8px}
.members .avatar:first-child{margin-left:0}
.members .avatar.slot{background:var(--line-2);color:var(--ink-3);border-style:dashed;border-color:var(--line)}
.gmeta{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2)}
.gmeta span{display:flex;gap:6px;align-items:center}
.cand.new{border-style:dashed;justify-content:center;align-items:flex-start}
/* sesión en vivo */
.timer{font-family:var(--display);font-weight:800;font-size:clamp(56px,14vw,76px);line-height:1;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0 2px}
.phase{text-align:center;font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.phase.focus{color:var(--accent)} .phase.break{color:var(--green)}
.tbar{height:8px;border-radius:4px;background:var(--line-2);overflow:hidden;margin:14px 0 6px}
.tbar i{display:block;height:100%;background:var(--accent);transition:width 1s linear}
.rounds{text-align:center;font-size:12.5px;color:var(--ink-3)}
.modal .box:focus{outline:none}
/* ---------- collage creativo + tablero vivo ---------- */
:root{--ol:2.5px solid var(--navy-d);--sh:5px 5px 0 var(--navy-d);--sh-s:3px 3px 0 var(--navy-d);--on-accent:var(--ink)}
.mode-solo{--on-accent:#fff}
body{background-color:var(--gold-soft);background-image:radial-gradient(rgba(34,42,92,.1) 1.3px,transparent 1.4px);background-size:22px 22px}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.side :focus-visible,.t-cta :focus-visible,.t-next :focus-visible{outline-color:var(--gold)}
h1,h2,h3{letter-spacing:-.02em}

.btn{border:var(--ol);border-radius:12px;box-shadow:var(--sh-s);font-weight:800;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-1px,-2px);box-shadow:5px 5px 0 var(--navy-d);filter:none}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--navy-d)}
.btn-primary{color:var(--ink)}
.btn-accent{color:var(--on-accent)}
.btn-gold{color:var(--ink)}
.btn-ghost-dark{background:var(--paper);color:var(--ink);border:var(--ol)}
.btn-ghost-dark:hover{background:var(--paper)}
.btn-line,.btn-line:hover{border:var(--ol)}

.card,.modecard,.panel,.cand,.subj,.qcard,.book,.tool,.sess,.chat,.calwrap,.aday,.notecard,.modal .box{border:var(--ol);box-shadow:var(--sh)}
.card{border-radius:20px}
.panel,.cand,.subj,.qcard,.book,.tool,.sess,.calwrap,.aday{border-radius:18px}
.cand,.subj,.qcard,.book,.tool,.modecard,.tile{position:relative;transform:rotate(var(--r,0deg));transition:transform .16s cubic-bezier(.2,1.4,.4,1),box-shadow .16s}
:is(.cand,.subj,.qcard,.book,.tool,.modecard,.tile):nth-child(3n+1){--r:-.7deg}
:is(.cand,.subj,.qcard,.book,.tool,.modecard,.tile):nth-child(3n+2){--r:.6deg}
:is(.cand,.subj,.qcard,.book,.tool,.modecard,.tile):nth-child(3n){--r:-.3deg}
:is(.cand,.subj,.qcard,.book,.tool,.modecard):hover,button.tile:hover{transform:rotate(0) translate(-2px,-4px);box-shadow:9px 9px 0 var(--navy-d);border-color:var(--navy-d)}
.input,.select,textarea.input,.search,.compose input,.choice label,.subrow,.fact,.item,.task,.know{border:2px solid var(--navy-d)}
.input:focus,.select:focus{border-color:var(--navy-d);box-shadow:0 0 0 3px var(--gold)}
.search{border-radius:14px;box-shadow:var(--sh-s)}

.side{border-right:var(--ol)}
.side .logo{font-size:25px}
.seg{border:2px solid var(--navy-d)}
.seg button.on-a{color:var(--ink)}
.nav button{margin:2px 12px;padding:10px 12px;border-left:0;border-radius:12px;width:calc(100% - 24px);transition:transform .14s}
.nav button:hover{background:rgba(255,255,255,.1);transform:translateX(3px)}
.nav button.on{background:var(--gold);color:var(--ink);font-weight:800;box-shadow:var(--sh-s)}
.nav button.on svg{stroke:var(--ink)}
.nav button .badge,.tabbar .badge{color:var(--ink)}

.kicker,.eyebrow{display:inline-block;background:var(--accent);color:var(--on-accent);border:2px solid var(--navy-d);border-radius:999px;padding:3px 12px;transform:rotate(-1.5deg);letter-spacing:.06em}
.eyebrow{background:var(--coral);color:var(--ink)}
.pagehead h1{font-size:clamp(34px,5vw,54px);line-height:1.02;font-weight:800;margin-top:10px}
.pagehead p{color:var(--ink-2);font-size:15px;margin-top:8px}
.panel h3{font-size:19px}

.stepper span{border:2px solid var(--navy-d);background:var(--paper)}
.stepper span.done{background:var(--green-soft)}
.stepper span.now{color:var(--ink);box-shadow:var(--sh-s);transform:rotate(-2deg)}
.chip{border:2px solid var(--navy-d);color:var(--ink);font-weight:700;transition:transform .12s}
.chip:hover{transform:translateY(-2px) rotate(-1deg)}
.chip.on{box-shadow:var(--sh-s)}
.segsw{background:var(--paper);border:2px solid var(--navy-d)}
.segsw button[aria-pressed="true"]{background:var(--gold);color:var(--ink);box-shadow:none}

.subj{min-height:138px}
.subj strong{font-family:var(--display);font-size:16px}
.subj small{color:var(--ink-2)}
.subj .sym{width:42px;height:42px;background:var(--paper);border:2px solid var(--navy-d);color:var(--ink);font-size:16px;transform:rotate(-5deg)}
.subj:nth-child(4n+1){background:var(--coral-soft)}
.subj:nth-child(4n+2){background:var(--teal-soft)}
.subj:nth-child(4n+3){background:var(--paper)}
.subj:nth-child(4n){background:var(--gold-soft)}
.subj.on,.subj.on:hover{background:var(--gold);border:var(--ol);box-shadow:9px 9px 0 var(--navy-d)}
.subj.on .sym{background:var(--navy-d)}
.subj.add{border-style:dashed;background:transparent;box-shadow:none}

.cand{padding:24px;gap:13px}
.cand.top::after{content:"mejor match";position:absolute;top:-14px;right:14px;background:var(--gold);color:var(--ink);border:2px solid var(--navy-d);border-radius:999px;padding:3px 12px;font-size:12px;font-weight:800;transform:rotate(4deg)}
.cand.new{background:transparent;box-shadow:none;border-style:dashed}
.avatar{border:2px solid var(--navy-d)}
.pct{font-size:58px;letter-spacing:-.03em}
.bar{height:10px;border-radius:6px;border:1.5px solid var(--navy-d);background:var(--paper)}
.bar i{border-radius:0}
.xchg{border:1.5px dashed var(--gold-ink);color:var(--ink)}
.tag{background:var(--paper);border:1.5px solid var(--navy-d);color:var(--ink)}
.ring{border:var(--ol)}
.ring div{border:var(--ol)}
.quote{background:var(--gold-soft);border:2px solid var(--navy-d);font-family:var(--display);font-style:normal;font-size:16px}

.msg.them{background:var(--paper);border:2px solid var(--navy-d)}
.msg.me{border:2px solid var(--navy-d)}
.send{border:2px solid var(--navy-d)}
.send svg{stroke:var(--ink)}
.prop{border:var(--ol);box-shadow:var(--sh-s)}
.blk{border:1.5px solid var(--navy-d)}
.blk{overflow-wrap:anywhere}
.wklist{display:flex;flex-direction:column;gap:8px}
.wkrow{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;align-items:start}
.wkrow>span{font-weight:800;padding-top:7px}
.wkrow>div{display:flex;flex-direction:column;gap:6px}
.blk.class{background:var(--paper);color:var(--ink)}
.blk.study{color:var(--ink)}
.blk.session{color:var(--ink)}
.task{transition:transform .14s}
.task:hover{transform:translateX(3px)}
.qcard:nth-child(3n+1){background:var(--coral-soft)}
.qcard:nth-child(3n+2){background:var(--teal-soft)}
.qcard:nth-child(3n){background:var(--paper)}
.qcard small,.book small,.tool small{color:var(--ink-2)}
.qcard strong,.book strong{font-family:var(--display);font-size:18px}
.book:nth-child(3n+1) .bi{background:var(--coral-soft)}
.book:nth-child(3n+2) .bi{background:var(--teal-soft)}
.book .bi{border:2px solid var(--navy-d)}
.modal .box{border-radius:22px}
.toast{background:var(--gold);color:var(--ink);border:var(--ol);box-shadow:var(--sh-s);font-weight:800}
.timer{font-size:clamp(64px,16vw,96px)}

.auth.dark{background:var(--gold);color:var(--ink)}
.auth.dark::before{background:var(--coral);border:var(--ol)}
.auth.dark::after{background:var(--teal);border:var(--ol)}
.welcome h1{font-size:clamp(58px,12vw,112px);line-height:.95;letter-spacing:-.04em}
.welcome p{color:var(--ink);font-size:18px;font-weight:600}
.fine{color:var(--ink);font-weight:600}
.dots span{border-color:var(--navy-d)}
.sticker{position:absolute;z-index:2;background:var(--paper);color:var(--ink);border:var(--ol);box-shadow:var(--sh-s);border-radius:14px;padding:10px 16px;font-family:var(--display);font-weight:800;font-size:18px;transform:rotate(var(--r,0deg));animation:floaty 4.5s ease-in-out infinite;animation-delay:var(--d,0s)}
.sticker b{display:block;font-size:42px;line-height:1;color:var(--ink)}
.sticker.c{background:var(--coral)} .sticker.t{background:var(--teal);color:#fff} .sticker.n{background:var(--navy-l)}
@keyframes floaty{0%,100%{translate:0 0}50%{translate:0 -11px}}

.modecard{border-radius:22px}
.modecard.sel-a{background:var(--coral);color:var(--ink);border-color:var(--navy-d)}
.modecard.sel-s{background:var(--teal);color:#fff;border-color:var(--navy-d)}
.modecard.sel-a :is(p,ul),.modecard.sel-s :is(p,ul){color:inherit}
.modecard.sel-a .ic,.modecard.sel-s .ic{background:var(--paper);color:var(--ink)}

    <nav class="tabbar" aria-label="Navegación">${TABS.map(([id,label,icn])=>`<button class="${navOn(id)&&!S.more?'on':''}" data-a="nav" data-v="${id}" aria-current="${navOn(id)?'page':'false'}">${ic(icn,22)}<span>${label}</span>${id==='match'&&S.sessions.filter(x=>!x.rating).length&&!solo?`<span class="badge">${S.sessions.filter(x=>!x.rating).length}</span>`:''}</button>`).join('')}<button class="${MORE.some(m=>m[0]===S.page)||S.more?'on':''}" data-a="more" aria-expanded="${!!S.more}">${ic('plus',22)}<span>Más</span></button></nav>
    <div class="sheet ${S.more?'open':''}" data-a="closemore"><div class="box" role="dialog" aria-label="Más opciones"><div class="grab"></div>${MORE.map(([id,label,icn])=>`<button class="it" data-a="nav" data-v="${id}">${ic(icn,20,'var(--accent)')}${label}</button>`).join('')}</div></div>
  </div>`;
}
function head(title, desc, extra=''){
  return `<div class="pagehead"><div><div class="kicker">${S.mode==='solo'?'Modo Solo':'Modo Acompañado'}</div><h1>${title}</h1>${desc?`<p>${desc}</p>`:''}</div>${extra}</div>`;
}
function page(){
  switch(S.page){
    case 'home': return S.mode==='solo'? pHomeSolo() : pHomeAcomp();
    case 'horarios': return pHorarios();
    case 'links': return libTabs()+pLinks();
    case 'tableros': return S.board ? pBoard() : libTabs()+pBoards();
    case 'archivos': return libTabs()+pArchivos();
    case 'match': return pMatch();
    case 'herramientas': return pTools();
    case 'ia': return S.aiView==='sources' ? pSources() : pIA();
    case 'cuadernos': return libTabs()+pBooks();

  }
}

/* ---------- home ---------- */
function pHomeAcomp(){
  const sess = S.sessions.length ? S.sessions.map(s=>`<div class="item"><span class="avatar" style="background:${s.av};width:38px;height:38px;font-size:13px">${esc(s.with[0])}</span><div class="grow"><strong>${esc(s.subject)} con ${esc(s.with)}</strong><small>${DAYS[s.day]} · ${SLOTS[s.slot]} · ${esc(s.place)}</small></div>${s.rating?`<span class="rate">${stars(s.rating.stars)}</span>`:s.done?`<button class="btn btn-gold btn-sm" data-a="rate" data-v="${s.id}">Calificar</button>`:`<span class="tag" style="background:var(--green-soft);color:var(--green)">Confirmada</span><button class="btn btn-accent btn-sm" data-a="golive" data-v="${s.id}">Empezar sesión</button><button class="btn btn-line btn-sm" data-a="cancelsess" data-v="${s.id}">${s.group?'Salir del grupo':'Cancelar'}</button>`}</div>`).join('')
    : `<div class="empty">Todavía no tienes sesiones acompañadas.<br><button class="btn btn-accent btn-sm" style="margin-top:12px" data-a="startmatch">Buscar compañero</button></div>`;
  const studyCount = S.blocks.filter(b=>b.kind!=='class').length;
  const best = CANDS.filter(c=>!S.blocked.includes(c.id) && c.uni===S.me.uni).sort((x,y)=>y.pct-x.pct)[0];
  const next = nextBlock();
  return head(`Hola, ${esc(first())}`, 'Tu semana de estudio de un vistazo.') +
  `<div class="bento">
    <section class="tile t-cta"><div><h2>¿Qué vas a estudiar hoy?</h2><p>Elige la materia y te mostramos quién es compatible contigo antes de que te comprometas.</p></div><div class="ctabtns"><button class="btn btn-primary" data-a="startmatch">${ic('match',18)} Buscar compañero</button><button class="btn btn-gold" data-a="startgroup">Buscar un grupo</button></div></section>
    ${best?`<button class="tile t-match" data-a="homecand" data-v="${best.id}"><small>Tu mejor match hoy</small><span class="big">${best.pct}%</span><strong>${esc(best.name)} · ${esc(uniOf(best.uni).short)}</strong><span class="mini">${best.brk.map(([k,v])=>`<div>${esc(k.replace('Nivel de conocimiento','Nivel'))}<span><i style="width:${v*100}%"></i></span></div>`).join('')}</span></button>`:''}
    ${focusTile(next)}
    ${streakTile('')}
    <div class="panel t-week"><h3>Tu semana</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div class="stat"><b data-count>${S.sessions.length}</b><span class="small muted">sesiones acompañadas</span></div>
        <div class="stat"><b data-count>${studyCount}</b><span class="small muted">bloques de estudio</span></div>
      </div>
      <button class="btn btn-line btn-sm btn-block" style="margin-top:16px" data-a="nav" data-v="horarios">Ver horario</button>
    </div>
    ${boardsTile()}
    <div class="panel t-sess"><h3>Próximas sesiones</h3><div class="list">${sess}</div></div>
  </div>`;
}
function boardsTile(){
  const n = S.boards.length, last = S.boards[0];
  return `<button class="tile t-boards" data-a="nav" data-v="tableros"><small>Tus tableros</small><h2>${n?`${n} tablero${n===1?'':'s'}`:'Crea tu primer tablero'}</h2><span class="small" style="font-weight:700">${last?`Último: ${esc(last.title)}`:'Ordena lo que viste en una sesión'}</span><strong style="margin-top:auto">Abrir tableros →</strong></button>`;
}
function nextBlock(){ return S.blocks.filter(x=>x.kind!=='class').sort((a,c)=>a.day-c.day||a.slot-c.slot)[0]; }
const FOCUS_RING = `<span class="ringwrap"><svg viewBox="0 0 104 104" aria-hidden="true"><circle cx="52" cy="52" r="44" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="10"/><path d="M52 8a44 44 0 1 1-35 70" fill="none" stroke="#F9C74F" stroke-width="10" stroke-linecap="round"/></svg>25</span>`;
function focusTile(b){
  return `<button class="tile t-pomo" ${b?`data-a="gosolo" data-v="${b.id}"`:'data-a="nav" data-v="horarios"'}>${FOCUS_RING}<strong>Modo foco · 25 min</strong></button>`;
}
function streakTile(extra){
  return `<section class="tile t-streak ${extra}"><small>Racha suave</small><span class="big" style="font-size:clamp(54px,6vw,76px)">${S.streak}</span><strong>días estudiando</strong><span class="week" aria-label="${S.streak} de 7 días">${[0,1,2,3,4,5,6].map(i=>`<i class="${i<S.streak?'on':''}"></i>`).join('')}</span><span class="small">Si paras un día, no pierdes nada.</span></section>`;
}
function pHomeSolo(){
  const tasks = S.tasks.map(t=>`<label class="task ${t.done?'done':''}"><input type="checkbox" data-a="task" data-v="${t.id}" ${t.done?'checked':''}><span>${esc(t.text)}</span><small>${esc(t.done?'Hecho':t.time)}</small></label>`).join('');
  const pending = S.tasks.filter(t=>!t.done).length;
  const blocksToday = S.blocks.filter(b=>b.day===1 && b.kind!=='class').length;
  const total = S.tasks.length, finished = total-pending, nb = nextBlock();
  return head(`Hola, ${esc(first())}`, 'Lo que necesitas para avanzar a tu ritmo, sin depender de nadie más.') +
  `<div class="bento">
    <div class="panel t-day"><h3>Tu día <span class="small muted" style="font-family:var(--body);font-weight:600">· ${pending} pendiente${pending===1?'':'s'}</span></h3>
      <div class="progress"><div class="bar"><i style="width:${total?finished/total*100:0}%;background:var(--teal)"></i></div>${finished} de ${total}</div>
      <div class="tasks">${tasks}</div>
      <form class="addrow" id="f-task"><label class="hidden" for="task-new">Nueva tarea</label><input class="input" id="task-new" placeholder="Agregar tarea, por ejemplo: repasar tema 3"><button class="btn btn-accent btn-sm" type="submit">Agregar</button></form>
    </div>
    <section class="tile t-next">${nb?`<div><small>Próximo bloque</small><h2>${esc(nb.title)}</h2><div class="sub2">${DAYS[nb.day]} · ${SLOTS[nb.slot]}</div></div>${FOCUS_RING}<button class="btn btn-gold btn-block" data-a="gosolo" data-v="${nb.id}">Empezar bloque de concentración</button>`:`<div><small>Próximo bloque</small><h2>Tu semana está libre</h2></div><button class="btn btn-gold btn-block" data-a="nav" data-v="horarios">Agregar un bloque</button>`}</section>
    <button class="qcard t-quick" data-a="nav" data-v="horarios">${ic('cal',24,'var(--ink)')}<strong>Horarios</strong><small>${blocksToday} bloque${blocksToday===1?'':'s'} el martes</small></button>
    <button class="qcard t-quick" data-a="nav" data-v="cuadernos">${ic('book',24,'var(--ink)')}<strong>Cuadernos</strong><small>${S.books.length} materias activas</small></button>
    <button class="qcard t-quick" data-a="nav" data-v="tableros">${ic('spark',24,'var(--ink)')}<strong>Tableros</strong><small>${S.boards.length} creado${S.boards.length===1?'':'s'}</small></button>
    ${streakTile('t-quick')}
  </div>`;
}

/* ---------- match flow ---------- */
function stepper(){
  const steps=[['materia','Materia'],['results','Resultados'],['profile','Perfil'],['chat','Chat'],['confirmed','Sesión']];
  const ix = steps.findIndex(s=>s[0]===S.step);
  return `<div class="stepper" aria-label="Progreso">${steps.map((s,i)=>`<span class="${i<ix?'done':i===ix?'now':''}">${i+1}. ${s[1]}</span>`).join('')}</div>`;
}
function pMatch(){
  if(S.mode==='solo'){
    return head('Match', '') + `<div class="empty" style="max-width:560px">Estás en modo Solo, así que aquí no te mostramos compañeros.<br>Si hoy quieres estudiar con alguien, cambia de modo.<br><button class="btn btn-primary btn-sm" style="margin-top:14px" data-a="setmode" data-v="acompanado">Cambiar a Acompañado</button></div>`;
  }
  return ({materia:mMateria, results:mResults, profile:mProfile, chat:mChat, confirmed:mConfirmed})[S.step]();
}
function mMateria(){
  const cards = SUBJECTS.map(s=>`<button class="subj ${S.subject===s.id?'on':''}" data-a="subject" data-v="${s.id}" aria-pressed="${S.subject===s.id}"><span class="sym">${esc(s.sym)}</span><strong>${esc(s.name)}</strong><small>${s.n} estudiantes activos</small></button>`).join('');
  return head('¿Qué quieres estudiar hoy?', 'Elige la materia o el tema. Con esto buscamos personas que estén repasando lo mismo que tú.') + stepper() +
  `<form class="search" id="f-subj"><span aria-hidden="true">${ic('search',16,'#6a7190')}</span><label class="hidden" for="subj-q">Buscar materia</label><input id="subj-q" placeholder="Busca una materia o escribe un tema específico…" value="${esc(S.subject==='custom'?S.customSubject:'')}"><button class="btn btn-line btn-sm" type="submit">Usar</button></form>
  <p class="label-caps">Materias frecuentes en tu facultad</p>
  <div class="subjects">${cards}<button class="subj add ${S.subject==='custom'?'on':''}" data-a="focussearch">${ic('plus',20)}<strong style="font-size:13px">${S.subject==='custom'?esc(S.customSubject):'Otra materia'}</strong></button></div>
  <p class="label-caps" style="margin-top:22px">¿Cómo quieres estudiar?</p>${matchSwitch()}
  <div class="actions" style="margin-top:0"><button class="btn btn-primary" data-a="find">${S.matchType==='grupo'?`Buscar grupos de ${esc(subjName())}`:`Buscar compatibles en ${esc(subjName())}`}</button></div>`;
}
/* Grupos visibles para la materia y la universidad elegidas (los mismos que muestra mGroups). */
const groupsInScope = () => GROUPS.filter(g=>!g.members.some(m=>S.blocked.includes(m)) && !S.sessions.some(s=>s.cid===g.id) && g.members.every(m=>inUni(CANDS.find(c=>c.id===m))));
const VERIFIED = `<span class="tag ver">${ic('check',11,'currentColor',3)} Correo institucional verificado</span>`;
const norm = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const uniOf = id => UNIS.find(u=>u.id===id) || UNIS[0];
const uniSel = () => S.uni==='mine' ? S.me.uni : S.uni;
const inUni = c => uniSel()==='all' || c.uni===uniSel();
const uniWhere = () => uniSel()==='all' ? 'todas las universidades' : uniOf(uniSel()).name;
const uniMatches = () => { const q=norm(S.uniQ.trim()); return q ? UNIS.filter(u=>norm(u.name+' '+u.short).includes(q)) : []; };
function uniList(){
  if(!S.uniQ.trim()) return '';
  const m = uniMatches();
  if(!m.length) return '<p class="small muted">No encontramos esa universidad. Revisa el nombre.</p>';
  return m.map(u=>{ const n=CANDS.filter(c=>c.uni===u.id && !S.blocked.includes(c.id)).length; return `<button class="chip" data-a="uni" data-v="${u.id}">${esc(u.name)} · ${n} estudiante${n===1?'':'s'}</button>`; }).join('');
}
function uniBar(){
  const chip = (v,label) => `<button class="chip ${S.uni===v?'on':''}" data-a="uni" data-v="${v}" aria-pressed="${S.uni===v}">${esc(label)}</button>`;
  const other = S.uni!=='mine' && S.uni!=='all' ? chip(S.uni, uniOf(S.uni).short) : '';
  return `<p class="label-caps" style="margin-bottom:8px">¿De qué universidad?</p><div class="unibar"><div class="chips" role="group" aria-label="Universidad">${chip('mine', uniOf(S.me.uni).short+' · tu universidad')}${other}${chip('all','Todas')}</div>
    <form class="search" id="f-uni"><span aria-hidden="true">${ic('search',14,'#6a7190')}</span><label class="hidden" for="uni-q">Buscar otra universidad</label><input id="uni-q" placeholder="Busca otra universidad…" autocomplete="off" value="${esc(S.uniQ)}"></form></div>
    <div class="unilist" id="unilist" aria-live="polite">${uniList()}</div>`;
}
function matchSwitch(){
  return `<div class="segsw" role="group" aria-label="Tipo de sesión">${[['uno','Con una persona'],['grupo','En grupo pequeño']].map(([k,l])=>`<button data-a="mtype" data-v="${k}" aria-pressed="${S.matchType===k}">${l}</button>`).join('')}</div>`;
}
function groupCard(g, mine){
  const ms = g.members.map(id=>CANDS.find(c=>c.id===id)).filter(Boolean);
  const free = g.cap - ms.length - (mine?1:0);
  const low = g.brk.slice().sort((a,b)=>a[1]-b[1])[0];
  const col = g.pct>=80?'var(--green)':g.pct>=70?'#B7860B':'var(--coral)';
  return `<article class="cand">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div class="members">${ms.map(c=>`<span class="avatar" style="background:${c.av}" title="${esc(c.name)}">${esc(c.name[0])}</span>`).join('')}${mine?`<span class="avatar" style="background:var(--navy)">${esc(first()[0])}</span>`:''}${Array.from({length:Math.max(free,0)},()=>'<span class="avatar slot" aria-hidden="true">+</span>').join('')}</div><span class="small muted">${ms.length+(mine?1:0)}/${g.cap}</span></div>
    <div><strong style="font-size:15px">${esc(g.name)}</strong><div class="small muted">${ms.map(c=>esc(c.name)).join(', ')||'Solo tú por ahora'}</div></div>
    ${mine?'':`<div class="pct" style="color:${col}">${g.pct}%</div><div class="small muted">compatibilidad del grupo contigo · capa más baja: <strong>${esc(low[0].toLowerCase())}</strong> (${esc(low[2].toLowerCase())})</div>`}
    <div class="gmeta"><span>${ic('cal',14)} ${DAYS[g.day]} · ${SLOTS[g.slot]}</span><span>${ic('pin',14)} ${esc(g.place)}</span><span>${ic('check',14)} Regla: ${esc(g.rule)}</span></div>
    ${mine?`<span class="tag ver">Tu grupo · te avisamos cuando alguien se una</span>`:free>0?`<button class="btn btn-primary btn-sm" data-a="joingroup" data-v="${g.id}">Unirme al grupo</button>`:`<span class="tag">Grupo completo</span>`}
  </article>`;
}
function mGroups(){
  const list = groupsInScope();
  const mine = S.myGroups.filter(g=>g.subject===subjName());
  const form = S.newGroup ? `<form class="panel" id="f-group" style="margin-bottom:18px;max-width:720px"><h3>Crear un grupo de ${esc(subjName())}</h3>
      <div class="field"><label for="gr-name">Nombre del grupo</label><input class="input" id="gr-name" placeholder="Ej: Repaso de la entrega 2"></div>
      <div class="field"><label for="gr-goal">Objetivo de la sesión</label><input class="input" id="gr-goal" placeholder="Ej: revisar los avances del proyecto"></div>
      <div class="sched" style="padding:0;border:0;background:none"><div class="row3">
        <div class="field" style="margin:0"><label for="gr-cap">Cupo</label><select class="select" id="gr-cap"><option value="3">3 personas</option><option value="4" selected>4 personas</option></select></div>
        <div class="field" style="margin:0"><label for="gr-day">Día</label><select class="select" id="gr-day">${DAYS.map((d,i)=>`<option value="${i}" ${i===2?'selected':''}>${d}</option>`).join('')}</select></div>
        <div class="field" style="margin:0"><label for="gr-slot">Hora</label><select class="select" id="gr-slot">${SLOTS.map((d,i)=>`<option value="${i}" ${i===3?'selected':''}>${d}</option>`).join('')}</select></div>
      </div></div>
      <div class="field"><label for="gr-place">Lugar</label><input class="input" id="gr-place" value="Biblioteca central, sala grupal" placeholder="Un lugar público del campus"></div>
      <div class="field"><label for="gr-rule">Regla del grupo</label><select class="select" id="gr-rule"><option>Pomodoro 50/10 y celulares guardados</option><option>Pomodoro 25/5 y celulares guardados</option><option>Cada quien trae un avance para revisar</option></select></div>
      <div class="actions" style="margin-top:6px"><button class="btn btn-primary" type="submit">Crear grupo</button><button class="btn btn-line" type="button" data-a="newgroup">Cancelar</button></div></form>` : '';
  return `<button class="back" data-a="step" data-v="materia">${ic('back',16)} Cambiar materia</button>` + head(esc(subjName()), 'Grupos de 3 o 4 personas. La compatibilidad del grupo considera a todos sus integrantes, y te mostramos cuál capa es la más baja.') + stepper() + matchSwitch() + uniBar() + form +
  `<div class="cands">${mine.map(g=>groupCard(g,true)).join('')}${list.map(g=>groupCard(g,false)).join('')}${S.newGroup?'':`<button class="cand new" data-a="newgroup">${ic('plus',22)}<strong style="font-size:15px">Crear un grupo</strong><span class="small muted">Define el objetivo, el cupo y la regla. Te avisamos cuando se unan personas compatibles.</span></button>`}</div>`;
}
function mResults(){
  if(S.matchType==='grupo') return mGroups();
  const inScope = CANDS.filter(c=>!S.blocked.includes(c.id) && inUni(c));
  const list = inScope.filter(c=>S.filters.every(f=>c.tags.includes(f))).sort((a,b)=>b.pct-a.pct);
  const chips = ['Compromiso alto','Silencio','Mismo nivel'].map(f=>`<button class="chip ${S.filters.includes(f)?'on':''}" data-a="filter" data-v="${f}" aria-pressed="${S.filters.includes(f)}">${f}</button>`).join('');
  const cards = list.length ? list.map((c,i)=>`<article class="cand ${i===0&&list.length>1?'top':''}">
      <div class="who"><span class="avatar" style="background:${c.av}">${esc(c.name[0])}</span><div><strong>${esc(c.name)}</strong><small>${esc(c.sem)} · ${esc(uniOf(c.uni).short)}</small></div></div>
      <div class="pct" style="color:${c.color}">${c.pct}%</div>
      ${rateTag(S.cr[c.id].r, S.cr[c.id].n)}
      <div>${VERIFIED}</div>
      <div class="bar"><i style="width:${c.pct}%;background:${c.color}"></i></div>
      <div class="small muted">${esc(c.reason)}</div>
      <div class="tagrow">${c.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
      <div class="xchg"><strong>Pide a cambio:</strong> ${esc(c.exchange)}</div>
      <button class="btn btn-line btn-sm" data-a="viewcand" data-v="${c.id}">Ver perfil y compatibilidad</button>
    </article>`).join('') : inScope.length ? `<div class="empty">Ningún perfil cumple todos los filtros. Quita alguno para ver más opciones.</div>` : `<div class="empty">Todavía no hay estudiantes de ${esc(uniWhere())} en esta materia.<br><button class="btn btn-line btn-sm" style="margin-top:12px" data-a="uni" data-v="all">Ver todas las universidades</button></div>`;
  return `<button class="back" data-a="step" data-v="materia">${ic('back',16)} Cambiar materia</button>` + head(esc(subjName()), `${list.length} persona${list.length===1?'':'s'} compatible${list.length===1?'':'s'} en ${esc(uniWhere())}. Ordenadas por compatibilidad, no por disponibilidad.`) + stepper() +
  matchSwitch() + uniBar() + `<div class="chips" role="group" aria-label="Filtros">${chips}</div><div class="cands">${cards}</div>` + groupNudge();
}
/* Aviso para quien prefiere grupo: en la validación del 2026-11-09 la opción quedaba escondida en el interruptor. */
function groupNudge(){
  const n = groupsInScope().length;
  return `<div class="note groupnudge"><span>¿Prefieres estudiar en grupo? ${n?`Hay ${n} grupo${n===1?'':'s'} de 3 o 4 personas en ${esc(uniWhere())}.`:'Puedes crear uno de 3 o 4 personas.'}</span><button class="btn btn-primary btn-sm" data-a="mtype" data-v="grupo">${n?'Ver grupos':'Crear un grupo'}</button></div>`;
}
function mProfile(){
  const c = cand();
  const rows = c.brk.map(([k,v,l])=>{const col = l==='Coincide'?'var(--green)':l==='Difiere'?'var(--coral)':'#B7860B';return `<div class="row"><div class="top"><span>${k}</span><span style="color:${col}">${l}</span></div><div class="bar"><i style="width:${v*100}%;background:${col}"></i></div></div>`}).join('');
  return `<button class="back" data-a="step" data-v="results">${ic('back',16)} Volver a resultados</button>` + stepper() +
  `<div class="prof">
    <div class="panel profside">
      <span class="avatar" style="background:${c.av};width:84px;height:84px;font-size:30px">${esc(c.name[0])}</span>

function mChat(){
  const c = cand();
  const msgs = S.chat.map((m,i)=>{

      const mine = m.from==='me';
      let foot='';
      if(m.status==='pending' && !mine){
        foot = `<div class="acts"><button class="btn btn-gold btn-sm" data-a="accept">Aceptar</button><button class="btn btn-line btn-sm" data-a="counter">Proponer otra cosa</button></div>` +
          (S.showOffers?`<div class="opts" role="group" aria-label="Qué ofreces">${OFFERS.map(o=>`<button class="chip" data-a="offer" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`:'');
      } else if(m.status==='waiting'){ foot = `<div class="state" style="color:var(--gold-ink)">Esperando respuesta de ${esc(c.name)}…</div>`; }
      else if(m.status==='accepted'){ foot = `<div class="state" style="color:var(--green)">${ic('check',14,'var(--green)',2.6)} Acuerdo aceptado</div>`; }
      else if(m.status==='replaced'){ foot = `<div class="state muted">Reemplazada por otra propuesta</div>`; }
      return `<div class="prop"><div class="t">PROPUESTA DE INTERCAMBIO · ${mine?'TÚ':esc(c.name.toUpperCase())}</div><p><strong>Ofrece:</strong> ${esc(m.offers)}</p><p><strong>A cambio de:</strong> ${esc(m.forWhat)}</p>${foot}</div>`;
    }
    if(m.type==='place'){
      const mine = m.from==='me';
      let foot='';
      if(m.status==='pending' && !mine) foot = `<div class="acts"><button class="btn btn-gold btn-sm" data-a="placeok">Me sirve</button><button class="btn btn-line btn-sm" data-a="placeother">Proponer otro lugar</button></div>`;
      else if(m.status==='waiting') foot = `<div class="state" style="color:var(--gold-ink)">Esperando respuesta de ${esc(c.name)}…</div>`;
      else if(m.status==='accepted') foot = `<div class="state" style="color:var(--green)">${ic('check',14,'var(--green)',2.6)} Lugar acordado</div>`;
      else if(m.status==='replaced') foot = `<div class="state muted">Reemplazado por otra propuesta</div>`;
      const tip = m.status==='pending'||m.status==='waiting' ? `<div class="safety">${ic('spark',14,'var(--green)')}<span>Para las primeras sesiones, mejor un lugar público del campus. Si algo te incomoda, puedes reportar desde el chat.</span></div>` : '';
      return `<div class="prop"><div class="t">PROPUESTA DE LUGAR · ${mine?'TÚ':esc(c.name.toUpperCase())}</div><p>${ic('pin',14)} <strong>${esc(m.text)}</strong></p>${tip}${foot}</div>`;
    }
    return `<div class="msg ${m.from}">${esc(m.text)}</div>`;
  }).join('');
  const agreed = S.chat.some(m=>m.type==='prop'&&m.status==='accepted');

  const sched = agreed && placeMsg ? `<form class="sched" id="f-sched"><h3>Agenda la sesión</h3>
    <p class="small" style="margin:0 0 12px;display:flex;gap:8px;align-items:center">${ic('pin',16,'var(--green)')} <span><strong>Lugar acordado en el chat:</strong> ${esc(placeMsg.text)}</span></p>
    <div class="row3" style="grid-template-columns:repeat(2,minmax(0,1fr))">
      <div class="field" style="margin:0"><label for="sc-day">Día</label><select class="select" id="sc-day">${DAYS.map((d,i)=>`<option value="${i}" ${i===1?'selected':''}>${d}</option>`).join('')}</select></div>
      <div class="field" style="margin:0"><label for="sc-slot">Hora</label><select class="select" id="sc-slot">${SLOTS.map((d,i)=>`<option value="${i}" ${i===3?'selected':''}>${d}</option>`).join('')}</select></div>
    </div>
    <button class="btn btn-primary" type="submit">Confirmar sesión</button></form>` : '';
  return `<button class="back" data-a="step" data-v="profile">${ic('back',16)} Volver al perfil</button>` + head('Chat con tu match','Pónganse de acuerdo en cómo, cuándo y qué se da a cambio.') + stepper() +
  `<div class="chat">
    <div class="convs"><h3>Conversaciones</h3>
      <div class="conv on"><span class="avatar" style="background:${c.av}">${esc(c.name[0])}</span><div><strong>${esc(c.name)}</strong><small>${esc(subjName())}</small></div></div>
      ${CANDS.filter(x=>x.id!==c.id && !S.blocked.includes(x.id)).map(x=>`<div class="conv" style="opacity:.55"><span class="avatar" style="background:${x.av}">${esc(x.name[0])}</span><div><strong>${esc(x.name)}</strong><small>Sin mensajes</small></div></div>`).join('')}
    </div>
    <div class="thread">
      <div class="thead"><span class="avatar" style="background:${c.av};width:40px;height:40px">${esc(c.name[0])}</span><div><strong>${esc(c.name)}</strong><span class="small muted">${esc(subjName())}</span></div><span class="pill">${c.pct}% compatible</span><button class="iconbtn" style="width:40px;height:40px" data-a="report" data-v="${c.id}" aria-label="Reportar o bloquear a ${esc(c.name)}" title="Reportar o bloquear">${ic('flag',18)}</button></div>
      <div class="msgs" id="msgs">${msgs}</div>
      ${sched}
      <form class="compose" id="f-msg"><label class="hidden" for="msg-in">Mensaje</label><input id="msg-in" placeholder="${S.placeMode?'Escribe el lugar que propones, ej: cafetería del bloque A':'Escribe un mensaje…'}" autocomplete="off"><button class="send" type="submit" aria-label="Enviar">${ic('send',16,'#fff',2.2)}</button></form>

}

    return {from:'ai', text:`No encontré esa sesión en tu historial, así que te armé el tablero de ${topic} listo para llenar. Si me pasas tus notas o archivos, lo trabajo con ellos.`, card:{type:'board',id:b.id}};
  }
  if(/que sabes|que tienes|contenido|fuentes/.test(q)) return {from:'ai', text:'Esto es lo que tengo de cada materia. Toca una para agregarle contenido.', card:{type:'know',items:allSubjects()}};
  const wantsQuiz = /quiz|examen|preguntas|practicar|evalua/.test(q), wantsSum = /resum|sintetiza/.test(q);
  if(wantsQuiz || wantsSum){
    const tm = q.match(/\b(?:de|sobre) ([a-z]+(?: [a-z]+){0,2})\s*$/), raw = tm && !/^(mis|mi|la|el) /.test(tm[1]+' ') ? text.substr(q.lastIndexOf(tm[1]), tm[1].length) : null;
    const sub = subject || (raw ? raw.charAt(0).toUpperCase()+raw.slice(1) : null), ask = wantsQuiz?'Hazme un quiz':'Resume mis notas';
    if(!sub){ const ready=allSubjects().filter(n=>aiUnits(n)>=(wantsQuiz?3:1)); return ready.length ? {from:'ai', text:'¿De qué materia? Estas tienen contenido suficiente:', card:{type:'subjects',ask,items:ready}} : {from:'ai', text:'Todavía no tengo contenido tuyo. Súbeme un archivo o escribe notas en tus cuadernos.', card:needCard(S.srcSubject, wantsQuiz?'quiz':'resumen')}; }
    const src = aiSources(sub), u = aiUnits(sub), short = /corto/.test(q);
    if(wantsSum){
      if(u<1) return {from:'ai', text:`Todavía no tengo nada de ${sub}, y no quiero inventarte un resumen. Necesito al menos una nota o un archivo.`, card:needCard(sub,'resumen')};
      const book = S.books.find(b=>b.name===sub), extra = src.filter(x=>x.kind==='file'||x.kind==='upload').map(x=>`«${x.label}»: en la versión real, aquí van sus ideas principales.`), ses = src.filter(x=>x.kind==='session').map(x=>x.label+': sesión registrada.');
      return {from:'ai', text:`Esto es lo esencial de lo que me has dado de ${sub}:`, lines:[...(book?book.notes.map(n=>n.t):[]),...ses,...extra], from_:src};
    }
    if(u<1) return {from:'ai', text:`Todavía no tengo contenido de ${sub}, y un quiz sin tu material sería inventado. Con un archivo o tres notas ya puedo hacerlo.`, card:needCard(sub,'quiz')};
    if(u<3 && !short) return {from:'ai', text:`Tengo muy poco de ${sub}: un quiz con esto saldría flojo. Te falta un archivo o ${3-u} nota${3-u===1?'':'s'} más.`, card:needCard(sub,'quiz')};
    const docs = src.filter(x=>x.kind==='file'||x.kind==='upload').map(x=>[`¿Cuál es la idea principal de «${x.label}»?`,'En la versión real, la pregunta y la respuesta salen del contenido del archivo.']);
    const notes = (S.books.find(b=>b.name===sub)||{notes:[]}).notes.map(n=>['Explica con tus palabras: '+n.t,'Compáralo con tu cuaderno.']);
    const items = (QUIZ[sub] && !short ? QUIZ[sub] : [...docs,...notes]).slice(0, short?2:4);
    return {from:'ai', text: short?'Va un quiz corto con lo poco que tengo.':'Aquí va. Intenta responder antes de ver cada respuesta.', card:{type:'quiz',subject:sub,items,open:[]}, from_:src};
  }
  if(/organiza|planea|plan |semana|horario/.test(q)){
    const pend = S.tasks.filter(t=>!t.done).slice(0,3), free=[];
    for(let d=0;d<5&&free.length<pend.length;d++) for(const sl of [3,4]) if(free.length<pend.length && !S.blocks.some(b=>b.day===d&&b.slot===sl)) free.push([d,sl]);
    return pend.length ? {from:'ai', text:'Repartí tus tareas pendientes en los espacios libres de la tarde.', card:{type:'plan',done:false,items:pend.map((t,i)=>({title:t.text.split(' — ')[0], day:free[i][0], slot:free[i][1]}))}} : {from:'ai', text:'No tienes tareas pendientes. Buen momento para adelantar algo.'};
  }
  if(/compan|match|con quien|estudiar con/.test(q)){
    const best = CANDS.filter(c=>!S.blocked.includes(c.id) && c.uni===S.me.uni).sort((x,y)=>y.pct-x.pct)[0];
    return best ? {from:'ai', text:'Por cómo estudias, esta es la persona que más te conviene hoy.', card:{type:'match',id:best.id}} : {from:'ai', text:'No encontré a nadie disponible en tu universidad.'};
  }
  const add = text.match(/^(?:agrega|anota|recuerdame|recuérdame)\s+(.{3,})/i);
  if(add){ S.tasks.unshift({id:Date.now(), text:add[1], time:'Hoy', done:false}); return {from:'ai', text:`Anotado en tus tareas de hoy: ${add[1]}.`}; }
  return {from:'ai', text:'Todavía no sé hacer eso en este prototipo. Puedo ayudarte con:', lines:['Crear un tablero de una sesión','Resumir lo que me des','Hacerte un quiz con tu material','Organizar tus tareas en la semana','Recomendarte con quién estudiar','Anotar una tarea: «agrega leer el capítulo 5»']};
}
function askAI(text){
  if(S.aiBusy || !text.trim()) return;
  S.ai.push({from:'me', text:text.trim()}); S.aiBusy=true; S.aiDraft=''; render();
  setTimeout(()=>{ S.ai.push(aiReply(text.trim())); S.aiBusy=false; render(); }, calm()?150:850);
}

    <div class="chips" role="group" aria-label="Ritmo" style="margin-bottom:6px">${RHYTHMS.map(([f,r,l])=>`<button class="chip ${L.focus===f?'on':''}" data-a="lvrhythm" data-v="${f}" aria-pressed="${L.focus===f}">${l}</button>`).join('')}</div>
    <div class="phase ${L.phase}" id="lv-phase" aria-live="polite">${L.phase==='focus'?'Concentración':'Descanso'}</div>
    <div class="timer" id="lv-time" role="timer" aria-label="Tiempo restante">${mmss(L.left)}</div>
    <div class="tbar"><i id="lv-bar" style="width:${(1-L.left/total)*100}%"></i></div>
    <div class="rounds" id="lv-rounds">${L.rounds} ronda${L.rounds===1?'':'s'} de concentración completada${L.rounds===1?'':'s'}</div>
    <div class="actions" style="justify-content:center;margin-top:16px"><button class="btn btn-accent" data-a="lvtoggle">${L.running?'Pausar':L.left===total?'Empezar':'Seguir'}</button><button class="btn btn-line" data-a="lvskip">${L.phase==='focus'?'Pasar a descanso':'Volver a concentrarse'}</button></div>
    ${myFiles(L.title).length?`<p class="label-caps" style="margin:20px 0 8px">Tus archivos de esta materia</p><div class="list">${myFiles(L.title).map(f=>fileRow(f,true)).join('')}</div>`:''}
    <p class="label-caps" style="margin:20px 0 8px">Antes de empezar</p>
    <div class="choice">${[['phone',L.solo?'Celular en silencio y lejos':'Celulares guardados'],['goal','Objetivo claro'],['water','Agua y materiales a la mano']].map(([k,l])=>`<label><input type="checkbox" data-a="lvcheck" data-v="${k}" ${L.checks[k]?'checked':''}><span>${l}</span></label>`).join('')}</div>
    <div class="actions"><button class="btn btn-primary" data-a="lvend">Terminar ${L.solo?'bloque':'sesión'}</button><button class="btn btn-line" data-a="lvclose">Salir sin terminar</button></div>
  </div></div>`;
}
function startLive(patch){
  const focus = /50/.test(S.prefs.join(' ')+ (S.me.bio||'')) ? 50 : 25;
  openModal({live:{focus, rest:focus===50?10:5, phase:'focus', left:focus*60, running:false, rounds:0, goal:'', checks:{}, ...patch}});
}
setInterval(()=>{
  const L = S.live; if(!L || !L.running) return;
  L.left--;
  if(L.left <= 0){
    if(L.phase==='focus'){ L.rounds++; L.phase='break'; L.left=L.rest*60; toast('¡Ronda completa! Toca descanso.'); }
    else { L.phase='focus'; L.left=L.focus*60; toast('Fin del descanso. A concentrarse.'); }
    render(); return;
  }
  const t=document.getElementById('lv-time'), b=document.getElementById('lv-bar');
  if(t) t.textContent = mmss(L.left);
  if(b) b.style.width = `${(1-L.left/((L.phase==='focus'?L.focus:L.rest)*60))*100}%`;
}, 1000);

const calm = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUp(){
  if(calm()) return;
  root.querySelectorAll('.pct,.big,[data-count]').forEach(el=>{
    const m = el.textContent.match(/^(\d+)(.*)$/); if(!m || +m[1]<2) return;
    const end=+m[1]; let t0;
    requestAnimationFrame(function tick(t){ t0=t0||t; const k=Math.min((t-t0)/650,1); el.textContent=Math.round(end*(1-Math.pow(1-k,3)))+m[2]; if(k<1 && el.isConnected) requestAnimationFrame(tick); });
  });
}
function celebrate(x,y){
  if(calm()) return;
  const cols=['#E8535A','#F9C74F','#027480','#CADCFC','#2F3C7E'];
  for(let i=0;i<16;i++){ const p=document.createElement('i'), a=i/16*6.283, d=70+Math.random()*90;
    p.className='pop'; p.style.cssText=`left:${x}px;top:${y}px;background:${cols[i%5]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d+40}px;--t:${Math.round(Math.random()*360)}deg;border-radius:${i%2?'50%':'3px'}`;
    document.body.appendChild(p); setTimeout(()=>p.remove(),900); }
}
function render(){
  const v = {welcome:vWelcome, signup:vSignup, login:vLogin, confirm:vConfirm, mode:vMode, app:vApp}[S.screen];
  const mb = document.querySelector('.modal .box'), keep = mb ? mb.scrollTop : 0;
  const ae = document.activeElement, fkey = ae && ae!==document.body ? (ae.id ? '#'+CSS.escape(ae.id) : ae.dataset && ae.dataset.a ? `[data-a="${ae.dataset.a}"]${ae.dataset.v!==undefined?`[data-v="${CSS.escape(ae.dataset.v)}"]`:''}${ae.dataset.k?`[data-k="${CSS.escape(ae.dataset.k)}"]`:''}` : ae.name ? `[name="${ae.name}"][value="${CSS.escape(ae.value)}"]` : null) : null;
  root.innerHTML = v();
  const key = [S.screen,S.page,S.step,S.matchType,S.mode,S.board,S.aiView].join('|'), enter = key!==render.k;
  render.k = key; root.classList.toggle('enter', enter);
  if(enter){ countUp(); if(S.page==='match' && S.step==='confirmed') celebrate(innerWidth/2, innerHeight/3); }
  const nb = document.querySelector('.modal .box'); if(nb && keep) nb.scrollTop = keep;
  if(nb && S.focusModal){ S.focusModal=false; nb.focus(); }
  else if(fkey){ const el=document.querySelector(fkey); if(el) el.focus({preventScroll:true}); else if(nb) nb.focus(); }
  const m = document.getElementById('msgs'); if(m) m.scrollTop = m.scrollHeight;

}

    const c=cand(), day=+val('sc-day'), slot=+val('sc-slot'), place=(S.chat.filter(m=>m.type==='place'&&m.status==='accepted').pop()||{}).text||'Por acordar';
    const deal=(S.chat.filter(m=>m.type==='prop'&&m.status==='accepted').pop()||{}).forWhat||'';
    S.blocks = S.blocks.filter(b=>!(b.day===day&&b.slot===slot));
    S.blocks.push({id:Date.now(), day, slot, title:subjName(), sub:`Con ${c.name}`, kind:'session', fromMatch:true});
    S.sessions.push({id:Date.now(), cid:c.id, subject:subjName(), with:c.name, av:c.av, pct:c.pct, day, slot, place, deal, done:false, rating:null});
    go({step:'confirmed'}); toast('Sesión agregada a tu horario');
  }
  if(f==='f-block'){
    const title=val('bl-title').trim()||'Bloque de estudio', day=+val('bl-day'), slot=+val('bl-slot');
    if(S.blocks.some(b=>b.day===day&&b.slot===slot)){ toast('Ya tienes algo en ese horario. Elige otro.'); return; }
    const kind=(document.querySelector('input[name="bl-kind"]:checked')||{}).value||'study', K=KINDS.find(x=>x[0]===kind);
    S.blocks.push({id:Date.now(), day, slot, title: val('bl-title').trim()||K[1], sub:K[1], kind}); S.addBlock=null; render(); toast({class:'Clase agregada al horario', study:'Bloque de estudio agregado al horario', session:'Sesión acompañada agregada al horario'}[kind]);
  }
  if(f==='f-group'){
    const name=val('gr-name').trim(); if(!name){ toast('Ponle un nombre al grupo'); return; }
    const g={id:'my'+Date.now(), subject:subjName(), name, cap:+val('gr-cap'), day:+val('gr-day'), slot:+val('gr-slot'), place:val('gr-place').trim()||'Por acordar', rule:val('gr-rule'), goal:val('gr-goal').trim(), members:[], brk:[], pct:0};
    S.myGroups.push(g);
    S.blocks = S.blocks.filter(b=>!(b.day===g.day&&b.slot===g.slot));
    S.blocks.push({id:Date.now(), day:g.day, slot:g.slot, title:g.subject, sub:`Grupo: ${g.name}`, kind:'session', fromMatch:true});
    S.sessions.push({id:Date.now(), cid:g.id, group:true, created:true, subject:g.subject, with:`Grupo «${g.name}» (esperando integrantes)`, av:'#2F3C7E', pct:0, day:g.day, slot:g.slot, place:g.place, deal:g.rule, goal:g.goal, done:false, rating:null});
    S.newGroup=false; go({step:'confirmed'}); toast('Grupo creado y agregado a tu horario');
  }
  if(f==='f-task'){ const t=val('task-new').trim(); if(!t) return; S.tasks.unshift({id:Date.now(),text:t,time:'Hoy',done:false}); render(); }
  if(f==='f-link'){ const t=val('ln-t').trim(); if(!t){toast('Escribe un nombre para el link'); return;} S.links.unshift({t, s:val('ln-s'), k:val('ln-k')}); render(); toast('Link guardado'); }
  if(f==='f-book'){ const n=val('book-in').trim(); if(!n) return; S.books.push({id:Date.now(), name:n, notes:[]}); render(); toast('Cuaderno creado'); }
  if(f==='f-profile'){
    const D=S.draft; if(!D.name.trim()){ S.errors={pname:'Escribe tu nombre.'}; render(); return; }
    S.user.name=D.name.trim();
    S.me={uni:D.uni, career:D.career.trim(), sem:D.sem, avail:D.avail.trim(), bio:D.bio.trim(), subjects:D.subjects.filter(x=>x.name.trim()).map(x=>({name:x.name.trim(), lvl:x.lvl, topics:x.topics.trim()}))};
    S.errors={}; go({editProfile:false, draft:null}); toast('Perfil actualizado');
  }
  if(f==='f-note'){ const t=val('note-in').trim(); if(!t) return; S.books.find(b=>b.id===S.openBook).notes.unshift({d:'Ahora',t}); render(); }
});
document.addEventListener('focusin', e=>{ if(e.target.id==='gs-q') gsPaint(); });
document.addEventListener('mousedown', e=>{ if(!e.target.closest('.gs')) gsClose(); });
document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ const i=document.getElementById('gs-q'); if(i){ e.preventDefault(); i.focus(); i.select(); } return; }
  if(e.target.id==='gs-q'){
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); gsActive=(gsActive+(e.key==='ArrowDown'?1:-1)+gsList.length)%gsList.length; gsPaint(); return; }
    if(e.key==='Enter'){ e.preventDefault(); gsRun(gsActive); return; }
    if(e.key==='Escape'){ gsClose(); return; }
  }
  if(e.key!=='Escape') return;
  if(S.connect){ S.connect=null; render(); }
  else if(S.report){ S.report=null; render(); }
  else if(S.rating){ S.rating=null; render(); }
  else if(S.live){ S.live=null; render(); toast('Saliste de la sesión sin terminarla'); }
  else if(S.more){ S.more=false; render(); }
});
render();
})();
</script>
